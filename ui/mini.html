<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Jarvis</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#000;--panel:#0a0a0b;--panel2:#141416;--line:#1f1f22;--text:#ededf0;--mute:#7d7d86;--acc:#fff;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:transparent}
body{background:var(--bg);color:var(--text);font:13px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
     border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;user-select:none}
.drag{height:14px;flex:none;cursor:default;display:flex;align-items:center;justify-content:center}
.drag i{width:26px;height:3px;border-radius:3px;background:#2a2a2e;display:block}
.body{flex:1;display:flex;align-items:center;gap:9px;padding:0 10px 2px;min-height:0}
.art{width:48px;height:48px;border-radius:9px;flex:none;background:var(--panel2);background-size:cover;background-position:center;
     border:1px solid var(--line);display:grid;place-items:center;color:#3a3a40}
.art svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tt{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{font-size:11px;color:#54545c}
.ctl{display:flex;align-items:center;gap:2px;flex:none}
button{font:inherit;color:var(--mute);background:none;border:0;cursor:pointer;display:grid;place-items:center;
       width:27px;height:27px;border-radius:7px;padding:0}
button:hover{color:var(--text);background:var(--panel2)}
button.play{color:var(--text);background:var(--panel2);width:32px;height:32px;border-radius:50%}
button.play:hover{background:#202024}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button.play svg{fill:currentColor;stroke:none;width:14px;height:14px}
.bar{height:2px;background:#17171a;flex:none;margin:0 10px 7px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--text);border-radius:2px;transition:width .25s linear}
.bar.off i{background:#2a2a2e}
</style>
</head>
<body>
<div class="drag pywebview-drag-region" id="drag"><i class="pywebview-drag-region"></i></div>
<div class="body">
  <div class="art" id="art"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
  <div class="info"><div class="tt" id="tt">Nada tocando</div><div class="ar" id="ar">Spotify desconectado</div></div>
  <div class="ctl">
    <button id="prev" title="Anterior"><svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
    <button class="play" id="play" title="Play/Pause"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
    <button id="next" title="Próxima"><svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
    <button id="open" title="Abrir Jarvis"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></button>
  </div>
</div>
<div class="bar off" id="bar"><i></i></div>
<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
async function api(name, args = {}) {
  try {
    const r = await fetch("/api/" + name, {method:"POST", headers:{"X-Token":TOKEN,"Content-Type":"application/json"}, body:JSON.stringify(args)});
    return await r.json();
  } catch (e) { return {}; }
}
const S = {playing:false, online:false, position:0, duration:0, at:0, volume:0, current:""};

function paint() {
  const t = S.title || "Nada tocando";
  const a = S.online ? (S.artist || "Spotify") : "Spotify offline";
  if ($("#tt").textContent !== t) $("#tt").textContent = t;
  if ($("#ar").textContent !== a) $("#ar").textContent = a;
  const key = (S.title || "") + (S.art || "");
  if (key !== S.current) {
    S.current = key;
    $("#art").style.backgroundImage = S.art ? `url("${S.art}")` : "";
    $("#art").innerHTML = S.art ? "" : '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
  }
  $("#play").innerHTML = (S.playing || S.playing === null)
    ? '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>'
    : '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
  $("#bar").classList.toggle("off", !S.online);
  tick();
}
function tick() {
  const pos = S.playing ? S.position + (Date.now() - S.at) / 1000 : S.position;
  const pct = S.duration > 0 ? Math.min(100, Math.max(0, pos / S.duration * 100)) : 0;
  $("#bar i").style.width = pct + "%";
}
setInterval(tick, 500);

async function sync() {
  const d = await api("spotify_state");
  if (d && typeof d === "object") {
    S.online = !!d.online;
    S.playing = d.playing === null ? null : !!d.playing;
    S.title = d.title || "";
    S.artist = d.artist || "";
    S.art = d.art || "";
    S.duration = d.duration || 0;
    if (Math.abs((d.position || 0) - S.position) > 1.6) S.position = d.position || 0;
    S.at = Date.now();
    S.volume = d.volume || 0;
    paint();
  }
}
sync();
setInterval(sync, 1500);

$("#play").onclick = () => { if (S.online) { api("spotify_cmd", {action:"toggle"}); S.playing = !S.playing; S.at = Date.now(); paint(); } };
$("#next").onclick = () => S.online && api("spotify_cmd", {action:"next"});
$("#prev").onclick = () => S.online && api("spotify_cmd", {action:"prev"});
$("#open").onclick = () => { api("mini_toggle"); setTimeout(()=>api("win_focus"), 120); };
$("#drag").ondblclick = () => { api("mini_toggle"); setTimeout(()=>api("win_focus"), 120); };

document.addEventListener("wheel", e => {
  if (!S.online) return;
  e.preventDefault();
  const v = Math.max(0, Math.min(1, S.volume + (e.deltaY < 0 ? 0.05 : -0.05)));
  S.volume = v;
  api("spotify_cmd", {action:"volume", value:v});
}, {passive:false});

document.addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); $("#play").click(); }
  if (e.key === "ArrowRight") $("#next").click();
  if (e.key === "ArrowLeft") $("#prev").click();
  if (e.key === "Escape") api("mini_toggle");
});
</script>
</body>
</html>
